<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HadisDigital - Premium Emerald Gold</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">

<style>
:root{
--primary:#46A29F;
--primary-dark:#1B4D3E;
--secondary:#D4AF37;
--bg:#F4F7F6;
--card:#FFFFFF;
--text:#1B4D3E;
--gradient-emerald:linear-gradient(135deg,#46A29F,#1B4D3E);
--shadow:0 8px 20px rgba(0,0,0,0.08);
}
.dark-theme{
--bg:#0A1613;
--card:#152A25;
--primary:#58C4C0;
--primary-dark:#81E6A4;
--secondary:#F9E076;
--text:#E0F2EF;
}
body{
margin:0;
font-family:'Inter',sans-serif;
background-color:var(--bg);
color:var(--text);
transition:.3s;
padding-bottom:100px;
overflow-x:hidden;
}
header{
background:var(--gradient-emerald);
color:white;
padding:25px 15px;
display:flex;
align-items:center;
position:sticky;
top:0;
z-index:1000;
border-bottom:4px solid var(--secondary);
border-radius:0 0 25px 25px;
}
.container{padding:20px;}
.card-kitab{
background:var(--card);
border-radius:20px;
padding:20px;
margin-bottom:15px;
display:flex;
align-items:center;
justify-content:space-between;
border-left:7px solid var(--secondary);
box-shadow:var(--shadow);
cursor:pointer;
}
.hadis-box{
background:var(--card);
padding:25px;
border-radius:20px;
margin-bottom:20px;
border-bottom:5px solid var(--secondary);
box-shadow:var(--shadow);
}
.arab{
font-family:'Amiri',serif;
font-size:26px;
direction:rtl;
line-height:2.2;
text-align:right;
color:var(--primary-dark);
}
.bottom-nav{
position:fixed;
bottom:0;
width:100%;
height:85px;
background:var(--card);
display:flex;
justify-content:space-around;
align-items:center;
border-top:2px solid var(--secondary);
z-index:1000;
border-radius:25px 25px 0 0;
}
.nav-item{
text-align:center;
color:#888;
cursor:pointer;
font-size:11px;
flex:1;
}
.nav-item.active{
color:var(--primary);
font-weight:bold;
}
.nav-item span{
font-size:24px;
display:block;
margin-bottom:4px;
}
input,select{
width:100%;
padding:15px;
margin:10px 0;
border-radius:12px;
border:1px solid #ddd;
box-sizing:border-box;
background:var(--card);
color:var(--text);
font-size:16px;
}
.btn-gold{
width:100%;
padding:15px;
background:var(--gradient-emerald);
color:white;
border:none;
border-radius:12px;
font-weight:bold;
cursor:pointer;
}
.modern-list-item{
background:var(--card);
padding:15px;
border-radius:15px;
margin-bottom:10px;
border:1px solid #eee;
display:flex;
justify-content:space-between;
cursor:pointer;
}
</style>
</head>

<body>

<header>
<div style="width:40px"></div>
<div style="flex-grow:1;text-align:center;">
<h3 style="margin:0;letter-spacing:2px;">HADIS DIGITAL</h3>
</div>
<button onclick="document.body.classList.toggle('dark-theme')" style="background:none;border:none;color:white;font-size:22px;cursor:pointer;">🌓</button>
</header>

<div id="app-content" class="container"></div>

<nav class="bottom-nav">
<div class="nav-item active" onclick="showHome()"><span>📚</span>Kitab</div>
<div class="nav-item" onclick="showSearch()"><span>🔍</span>Cari</div>
<div class="nav-item" onclick="showHarian()"><span>🌟</span>Quotes Harian</div>
<div class="nav-item" onclick="showMenuLainnya()"><span>☰</span>Lainnya</div>
</nav>

<script>

const API_BASE="https://api.hadith.sutanlab.id";

const books=[
{ id:"bukhari", name:"HR. Bukhari" },
{ id:"muslim", name:"HR. Muslim" },
{ id:"tirmidzi", name:"HR. Tirmidzi" },
{ id:"nasai", name:"HR. Nasai" },
{ id:"abu-daud", name:"HR. Abu Daud" },
{ id:"ibnu-majah", name:"HR. Ibnu Majah" },
{ id:"ahmad", name:"HR. Ahmad" }
];

window.onload=()=>showHome();

function updateNav(i){
document.querySelectorAll('.nav-item').forEach((it,idx)=>it.classList.toggle('active',idx===i));
}

function showHome(){
updateNav(0);

const today = new Date();
const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
const tanggal = today.toLocaleDateString('id-ID', options);

let h = `
<div class="hadis-box" style="text-align:center;border:2px solid var(--secondary);">
<h3 style="margin-top:0;color:var(--primary-dark);">${tanggal}</h3>
<p style="font-style:italic;color:var(--primary);margin-top:10px;">
"Ilmu adalah cahaya, dan hadis adalah lentera penerangnya."
</p>
</div>
`;

books.forEach(b=>{
h+=`<div class="card-kitab" onclick="loadBook('${b.id}','${b.name}')">
<div><b>${b.name}</b></div>
<div style="color:var(--primary);font-size:20px;">➔</div>
</div>`;
});

document.getElementById("app-content").innerHTML=h;
}
async function loadBook(id,name){
const area=document.getElementById("app-content");
area.innerHTML="<div style='text-align:center;padding:50px;'>Memuat hadis...</div>";
try{
const res=await fetch(`${API_BASE}/books/${id}?range=1-20`);
const json=await res.json();
let h=`<button onclick="showHome()" style="background:none;border:none;color:var(--primary);font-weight:bold;padding-bottom:15px;">← KEMBALI</button>
<h2>${name}</h2>`;
json.data.hadiths.forEach(item=>{
h+=`<div class="hadis-box">
<div class="arab">${item.arab}</div>
<p style="margin-top:15px;border-top:1px dashed #ddd;padding-top:15px;">${item.id}</p>
</div>`;
});
area.innerHTML=h;
}catch(e){
area.innerHTML="<div class='hadis-box'>Gagal mengambil data.</div>";
}
}

function showSearch(){
updateNav(1);
let opts=books.map(b=>`<option value="${b.id}">${b.name}</option>`).join('');
document.getElementById("app-content").innerHTML=`
<div class="hadis-box">
<h3>🔍 Cari Hadis</h3>
<select id="sKitab">${opts}</select>
<input type="number" id="sNo" placeholder="Nomor hadis...">
<button class="btn-gold" onclick="doSearch()">CARI</button>
</div>
<div id="resSearch"></div>`;
}

async function doSearch(){
const k=document.getElementById("sKitab").value;
const n=document.getElementById("sNo").value;
const res=document.getElementById("resSearch");
if(!n)return;
res.innerHTML="Mencari...";
try{
const r=await fetch(`${API_BASE}/books/${k}/${n}`);
const d=await r.json();
res.innerHTML=`<div class="hadis-box">
<div class="arab">${d.data.contents.arab}</div>
<p>${d.data.contents.id}</p>
</div>`;
}catch(e){
res.innerHTML="<div class='hadis-box'>Hadis tidak ditemukan.</div>";
}
}

function showHarian(){
