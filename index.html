<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HadisDigital Premium</title>

<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">

<style>
:root{
--primary:#46A29F;
--primary-dark:#1B4D3E;
--secondary:#D4AF37;
--bg:#F4F7F6;
--card:#FFFFFF;
--text:#1B4D3E;
--radius:20px;
}

body{
margin:0;
font-family:'Inter',sans-serif;
background:var(--bg);
color:var(--text);
padding-bottom:90px;
}

header{
background:linear-gradient(135deg,#46A29F,#1B4D3E);
color:white;
padding:15px;
text-align:center;
position:sticky;
top:0;
z-index:1000;
}

.container{padding:20px;}

.card{
background:var(--card);
padding:20px;
border-radius:var(--radius);
margin-bottom:15px;
box-shadow:0 5px 15px rgba(0,0,0,0.08);
}

.hadis-box{
background:var(--card);
padding:20px;
border-radius:var(--radius);
margin-bottom:15px;
border-bottom:4px solid var(--secondary);
}

.arab{
font-family:'Amiri',serif;
font-size:24px;
direction:rtl;
text-align:right;
line-height:2;
color:var(--primary-dark);
}

.bottom-nav{
position:fixed;
bottom:0;
width:100%;
height:70px;
background:var(--card);
display:flex;
justify-content:space-around;
align-items:center;
border-top:2px solid var(--secondary);
}

.nav-item{
text-align:center;
font-size:12px;
cursor:pointer;
flex:1;
}

.nav-item.active{
color:var(--primary);
font-weight:bold;
}

button{
cursor:pointer;
border:none;
padding:10px 15px;
border-radius:10px;
background:var(--primary);
color:white;
}
</style>
</head>
<body>

<header>
<h3>HADIS DIGITAL</h3>
</header>

<div id="app-content" class="container"></div>

<nav class="bottom-nav">
<div class="nav-item active" onclick="showHome()">📚<br>Kitab</div>
<div class="nav-item" onclick="showSearch()">🔍<br>Cari</div>
<div class="nav-item" onclick="showHarian()">🌟<br>Harian</div>
<div class="nav-item" onclick="showMenuLainnya()">☰<br>Lainnya</div>
</nav>

<script>

const books=[
{id:"bukhari",name:"HR. Bukhari"},
{id:"muslim",name:"HR. Muslim"},
{id:"tirmidzi",name:"HR. Tirmidzi"},
{id:"nasai",name:"HR. Nasai"},
{id:"abu-daud",name:"HR. Abu Daud"},
{id:"ibnu-majah",name:"HR. Ibnu Majah"},
{id:"ahmad",name:"HR. Ahmad"}
];

window.onload=()=>showHome();

function updateNav(i){
document.querySelectorAll('.nav-item')
.forEach((el,idx)=>el.classList.toggle('active',idx===i));
}

function showHome(){
updateNav(0);
let h="<h3>Daftar Kitab</h3>";
books.forEach(b=>{
h+=`<div class="card" onclick="loadBook('${b.id}','${b.name}')">
<b>${b.name}</b>
</div>`;
});
document.getElementById("app-content").innerHTML=h;
}

async function loadBook(id,name){
updateNav(-1);
const area=document.getElementById("app-content");
area.innerHTML="Memuat...";

try{
const res=await fetch(`https://api.hadith.sutanlab.id/books/${id}?range=1-15`);
const json=await res.json();
let h=`<button onclick="showHome()">← Kembali</button><h3>${name}</h3>`;

json.data.hadiths.forEach(item=>{
h+=`
<div class="hadis-box">
<div class="arab">${item.arab}</div>
<p>${item.id}</p>
</div>`;
});

area.innerHTML=h;
window.scrollTo(0,0);

}catch(e){
area.innerHTML="Gagal memuat hadis.";
}
}

function showSearch(){
updateNav(1);
let opts=books.map(b=>`<option value="${b.id}">${b.name}</option>`).join("");

document.getElementById("app-content").innerHTML=`
<div class="card">
<h3>Cari Hadis</h3>
<select id="kitab">${opts}</select>
<input type="number" id="nomor" placeholder="Nomor hadis">
<br><br>
<button onclick="doSearch()">Cari</button>
</div>
<div id="hasil"></div>
`;
}

async function doSearch(){
const k=document.getElementById("kitab").value;
const n=document.getElementById("nomor").value;
if(!n)return;

const hasil=document.getElementById("hasil");
hasil.innerHTML="Mencari...";

try{
const res=await fetch(`https://api.hadith.sutanlab.id/books/${k}/${n}`);
const json=await res.json();
const d=json.data;

hasil.innerHTML=`
<div class="hadis-box">
<div class="arab">${d.contents.arab}</div>
<p>${d.contents.id}</p>
</div>`;
}catch{
hasil.innerHTML="Hadis tidak ditemukan.";
}
}

function showHarian(){
updateNav(2);
document.getElementById("app-content").innerHTML=`
<div class="hadis-box">
<h3>Hadis Harian</h3>
<div class="arab">خَيْرُ النَّاسِ أَنْفَعُهُمْ لِلنَّاسِ</div>
<p>Sebaik-baik manusia adalah yang paling bermanfaat bagi orang lain. (HR. Ahmad)</p>
</div>`;
}

function showMenuLainnya(){
updateNav(3);
document.getElementById("app-content").innerHTML=`
<div class="card">
<h3>Tentang Aplikasi</h3>
<p>Aplikasi Hadis Digital versi Premium Emerald Gold.</p>
</div>

<div class="card">
<h3>Kontak</h3>
<p>Email: mholis1991@gmail.com</p>
</div>

<div class="card">
<h3>Donasi</h3>
<p>BCA 6095055005 a.n Muhamad Holis</p>
</div>
`;
}

</script>
</body>
</html>
